name: Setup toolchain
description: Install the pinned pnpm/Node toolchain and project dependencies
inputs:
  install:
    description: Run pnpm install --frozen-lockfile after toolchain setup
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      with:
        version: 12.4.2
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
