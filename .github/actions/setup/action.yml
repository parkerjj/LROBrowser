name: Setup toolchain
description: Install the pinned pnpm/Node toolchain and project dependencies
inputs:
  install:
    description: Run pnpm install --frozen-lockfile after toolchain setup
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.4.2
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
