name: IWA CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: iwa-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verify official HTTPS via real JavaScript TLS on Direct TCP/443
        env:
          LASTRO_TLS_LIVE: '1'
        run: pnpm exec vitest run test/direct-tls-live.test.ts --testTimeout 30000
      - run: pnpm prepare:runtime
      - name: Focused HTTPS transport and resource Worker regression tests
        run: pnpm exec vitest run test/direct-http-resource.test.ts test/lastro-login-http.test.ts test/resource-worker.test.ts test/official-online-profiles.test.ts
      # Validate the release artifacts before the slower full test suite,
      # so packaging failures are visible without waiting for ~4,700 tests.
      - run: pnpm build
      - name: Locate forbidden dynamic-code call sites in bundled app
        run: |
          node --input-type=module <<'NODE'
          import ts from 'typescript';
          import { readFileSync, readdirSync } from 'node:fs';
          const files = readdirSync('dist/assets').filter(name => name.endsWith('.js'));
          for (const name of files) {
            const source = readFileSync('dist/assets/' + name, 'utf8');
            const ast = ts.createSourceFile(name, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.JS);
            let count = 0;
            function inspect(node) {
              if ((ts.isCallExpression(node) || ts.isNewExpression(node)) &&
                  ts.isIdentifier(node.expression) && ['eval', 'Function'].includes(node.expression.text) &&
                  count++ < 8) {
                const start = Math.max(0, node.getStart(ast) - 180);
                const end = Math.min(source.length, node.end + 160);
                console.log(name + ':' + node.getStart(ast) + ' ' + source.slice(start, end));
              }
              ts.forEachChild(node, inspect);
            }
            inspect(ast);
          }
          NODE
      - run: pnpm audit:iwa
      - run: pnpm bundle:iwa -- --out release/lastro-v2-ci.wbn
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: iwa-ci-${{ github.sha }}
          path: |
            release/lastro-v2-ci.wbn
            release/audit-report.json
          if-no-files-found: error
