name: IWA CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: iwa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify official HTTPS via real JavaScript TLS on Direct TCP/443
        env:
          LASTRO_TLS_LIVE: '1'
        run: pnpm exec vitest run test/direct-tls-live.test.ts --testTimeout 30000
      - run: pnpm build
      - run: pnpm audit:iwa
      - run: pnpm bundle:iwa -- --out release/lastro-v2-ci.wbn
      - uses: actions/upload-artifact@v4
        with:
          name: iwa-ci-${{ github.sha }}
          path: |
            release/lastro-v2-ci.wbn
            release/audit-report.json
          if-no-files-found: error
