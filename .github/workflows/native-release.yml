name: Native desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Native release code
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node --test test/publish-native-r2.node.mjs

  prepare:
    name: Prepare the Native release inputs
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Allocate the desktop version
        id: version
        run: |
          for part in "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"; do
            [[ "$part" =~ ^[1-9][0-9]{0,4}$ && "$part" -le 65535 ]]
          done
          echo "value=1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Download and validate the KoreEngine Release
        env:
          KE_REPOSITORY_READ_TOKEN: ${{ secrets.KE_REPOSITORY_READ_TOKEN }}
        run: node scripts/kore-local.mjs --download-release --out "$RUNNER_TEMP/native-ke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ke-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/native-ke/
          if-no-files-found: error
          retention-days: 3

  build:
    name: Package Native ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    environment: production
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-universal
            runner: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
            deb-arch: amd64
            rpm-arch: x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
            deb-arch: arm64
            rpm-arch: aarch64
    env:
      NATIVE_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      RUST_TARGET: ${{ matrix.target }}
      TARGET_BUNDLES: ${{ matrix.bundles }}
      XWIN_ACCEPT_LICENSE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-ke-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/native-ke
      - name: Import the verified KoreEngine package
        run: node scripts/kore-local.mjs --import-package "$RUNNER_TEMP/native-ke/package" --release-metadata "$RUNNER_TEMP/native-ke/release.json"
      - name: Install native packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [[ "$TARGET_PLATFORM" == windows-* ]]; then
            sudo apt-get install -y --no-install-recommends clang lld llvm nsis
          else
            sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm
          fi
      - name: Install the pinned toolchain and Tauri CLI
        run: |
          rust_targets=(--target wasm32-unknown-unknown)
          if [[ "$TARGET_PLATFORM" == macos-* ]]; then
            rust_targets+=(--target aarch64-apple-darwin --target x86_64-apple-darwin)
          else
            rust_targets+=(--target "$RUST_TARGET")
          fi
          rustup toolchain install 1.99.0 --profile minimal "${rust_targets[@]}"
          if [[ "$TARGET_PLATFORM" == windows-* ]]; then
            cargo +1.99.0 install cargo-xwin --version 0.23.1 --locked
          fi
          pnpm dlx @tauri-apps/cli@2.12.5 --version
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/native-target" >> "$GITHUB_ENV"
      - name: Configure release bundling
        env:
          NATIVE_UPDATER_PUBLIC_KEY: ${{ vars.NATIVE_UPDATER_PUBLIC_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const pubkey = process.env.NATIVE_UPDATER_PUBLIC_KEY?.trim();
          if (!pubkey || !/^[A-Za-z0-9+/]+={0,2}$/.test(pubkey)
            || !Buffer.from(pubkey, 'base64').toString('utf8').startsWith('untrusted comment: minisign public key')) {
            throw Error('Set NATIVE_UPDATER_PUBLIC_KEY to the contents of the Tauri signer .pub file.');
          }
          const linux = process.env.TARGET_PLATFORM.startsWith('linux-');
          const feed = linux ? 'linux.json' : 'latest.json';
          const config = {
            version: process.env.NATIVE_VERSION,
            // Tauri derives Debian and RPM package identifiers from the product name.
            ...(linux ? { productName: 'LRO Client' } : {}),
            build: { beforeBuildCommand: null },
            bundle: {
              active: true,
              targets: process.env.TARGET_BUNDLES.split(','),
              createUpdaterArtifacts: true,
              windows: { nsis: { installMode: 'currentUser' } },
            },
            plugins: {
              updater: {
                pubkey,
                endpoints: [`https://client.ltsd.ro/native/${feed}`],
                requireSignedVersion: true,
                windows: { installMode: 'passive' },
              },
            },
          };
          writeFileSync(join(process.env.RUNNER_TEMP, 'native-release.json'), JSON.stringify(config));
          NODE
      - name: Build and verify the Native frontend
        env:
          KE_REQUIRE_PACKAGE: '1'
        run: |
          pnpm build:native
          node scripts/kore-local.mjs --verify-dist dist-native --release-metadata "$RUNNER_TEMP/native-ke/release.json"
      - name: Compile the release binary
        working-directory: native
        run: |
          runner=()
          if [[ "$TARGET_PLATFORM" == windows-* ]]; then runner=(--runner cargo-xwin); fi
          pnpm dlx @tauri-apps/cli@2.12.5 build --no-bundle --ci --config "$RUNNER_TEMP/native-release.json" --target "$RUST_TARGET" "${runner[@]}" -- --locked
      - name: Bundle and sign Windows or Linux updater artifacts
        if: runner.os == 'Linux'
        working-directory: native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          : "${TAURI_SIGNING_PRIVATE_KEY:?Missing Tauri update signing key in the production environment}"
          pnpm dlx @tauri-apps/cli@2.12.5 bundle --ci --config "$RUNNER_TEMP/native-release.json" --target "$RUST_TARGET" --bundles "$TARGET_BUNDLES"
      - name: Sign, notarize and bundle the macOS updater artifacts
        if: runner.os == 'macOS'
        working-directory: native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER ASC_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing macOS release credential: $name" >&2; exit 1; }
          done
          umask 077
          notary_dir=$(mktemp -d "$RUNNER_TEMP/native-notary.XXXXXX")
          APPLE_API_KEY_PATH="$notary_dir/AuthKey.p8"
          export APPLE_API_KEY_PATH
          trap 'rm -f -- "$APPLE_API_KEY_PATH"; rmdir -- "$notary_dir"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          unset ASC_PRIVATE_KEY
          pnpm dlx @tauri-apps/cli@2.12.5 bundle --ci --config "$RUNNER_TEMP/native-release.json" --target "$RUST_TARGET" --bundles "$TARGET_BUNDLES"
          shopt -s nullglob
          bundle="$CARGO_TARGET_DIR/$RUST_TARGET/release/bundle"
          apps=("$bundle"/macos/*.app)
          dmgs=("$bundle"/dmg/*.dmg)
          [[ ${#apps[@]} -eq 1 && ${#dmgs[@]} -eq 1 ]]
          app="${apps[0]}"
          dmg="${dmgs[0]}"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/$executable"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/native-dmg-notary.json"
          node -e 'if (require(process.argv[1]).status !== "Accepted") process.exit(1)' "$RUNNER_TEMP/native-dmg-notary.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Collect named installers and signatures
        env:
          DEB_ARCH: ${{ matrix.deb-arch }}
          RPM_ARCH: ${{ matrix.rpm-arch }}
        run: |
          shopt -s nullglob
          bundle="$CARGO_TARGET_DIR/$RUST_TARGET/release/bundle"
          prefix="LRO-Client-$NATIVE_VERSION"
          mkdir -p "$RUNNER_TEMP/native-release"
          collect() {
            local output="$1" signed="$2"
            shift 2
            [[ $# -eq 1 ]] || { echo "Expected exactly one bundle for $output, found $#" >&2; return 1; }
            test -s "$1"
            cp -- "$1" "$RUNNER_TEMP/native-release/$output"
            if [[ "$signed" == yes ]]; then
              test -s "$1.sig"
              cp -- "$1.sig" "$RUNNER_TEMP/native-release/$output.sig"
            fi
          }
          case "$TARGET_PLATFORM" in
            windows-x64) collect "$prefix-windows-x64-setup.exe" yes "$bundle"/nsis/*-setup.exe ;;
            macos-universal)
              collect "$prefix-macos-universal.dmg" no "$bundle"/dmg/*.dmg
              collect "$prefix-macos-universal.app.tar.gz" yes "$bundle"/macos/*.app.tar.gz
              ;;
            linux-*)
              collect "$prefix-linux-$DEB_ARCH.deb" yes "$bundle"/deb/*.deb
              collect "$prefix-linux-$RPM_ARCH.rpm" yes "$bundle"/rpm/*.rpm
              deb="$RUNNER_TEMP/native-release/$prefix-linux-$DEB_ARCH.deb"
              rpm="$RUNNER_TEMP/native-release/$prefix-linux-$RPM_ARCH.rpm"
              [[ "$(dpkg-deb -f "$deb" Package)" == lro-client ]]
              [[ "$(dpkg-deb -f "$deb" Architecture)" == "$DEB_ARCH" ]]
              [[ "$(dpkg-deb -f "$deb" Version)" == "$NATIVE_VERSION" ]]
              [[ "$(rpm -qp --qf '%{NAME}:%{ARCH}:%{VERSION}' "$rpm")" == "lro-client:$RPM_ARCH:$NATIVE_VERSION" ]]
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-bundles-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish Native to R2 and GitHub
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    timeout-minutes: 25
    env:
      NATIVE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-bundles-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/native-release
      - name: Publish immutable files and then advance the Native update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_UPDATER_PUBLIC_KEY: ${{ vars.NATIVE_UPDATER_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo 'Refusing stale main Native release.' >&2; exit 1; }
          node scripts/publish-native-r2.mjs --release-dir "$RUNNER_TEMP/native-release" --version "$NATIVE_VERSION" --commit "$GITHUB_SHA"
      - name: Confirm the public update feeds match the release
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { setTimeout as delay } from 'node:timers/promises';
          for (const name of ['latest.json', 'linux.json']) {
            const expected = await readFile(join(process.env.RUNNER_TEMP, 'native-release', name), 'utf8');
            let lastError;
            for (let attempt = 0; attempt < 5; attempt++) {
              if (attempt) await delay(2000);
              try {
                const response = await fetch(`https://client.ltsd.ro/native/${name}`, {
                  headers: { 'cache-control': 'no-cache' }, redirect: 'error', signal: AbortSignal.timeout(10000),
                });
                if (!response.ok) throw Error(`HTTP ${response.status}`);
                if (await response.text() !== expected) throw Error('response differs from the published JSON');
                lastError = undefined;
                break;
              } catch (error) { lastError = error; }
            }
            if (lastError) throw Error(`Native ${name} is not visible at the public CDN`, { cause: lastError });
            console.log(`Verified public Native ${name}`);
          }
          NODE
      - name: Publish the matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo 'Refusing stale main Native release.' >&2; exit 1; }
          tag="native-$NATIVE_VERSION"
          files=("$RUNNER_TEMP/native-release"/*)
          if release=$(gh release view "$tag" --json isDraft,targetCommitish); then
            [[ "$(jq -r .targetCommitish <<< "$release")" == "$GITHUB_SHA" ]]
            if [[ "$(jq -r .isDraft <<< "$release")" == true ]]; then
              gh release upload "$tag" "${files[@]}" --clobber
              gh release edit "$tag" --draft=false --latest=false
            fi
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Native $NATIVE_VERSION" --generate-notes --latest=false
          fi
