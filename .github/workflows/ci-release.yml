name: IWA CI & Release

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') && !startsWith(github.ref, 'refs/tags/') }}

env:
  IWA_UPDATE_MANIFEST_URL: https://client.ltsd.ro/updates.json
  IWA_BUNDLE_BASE_URL: https://client.ltsd.ro/

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: TLS probe & full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Verify official HTTPS via real JavaScript TLS on Direct TCP/443
        env:
          LASTRO_TLS_LIVE: "1"
        run: pnpm exec vitest run test/direct-tls-live.test.ts --testTimeout 30000
      - run: pnpm prepare:runtime
      - name: Focused HTTPS transport and resource Worker regression tests
        run: pnpm exec vitest run test/direct-http-resource.test.ts test/lastro-login-http.test.ts test/resource-worker.test.ts test/official-online-profiles.test.ts
      - name: Full test suite
        run: pnpm exec vitest run --exclude test/release-smoke.test.ts

  build-iwa:
    name: Build IWA bundle
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Minify production JavaScript
        if: env.RELEASE_BUILD == 'true'
        run: pnpm minify:release
      - name: Inject production manifest metadata
        if: env.RELEASE_BUILD == 'true'
        env:
          IWA_VERSION: 0.1.${{ github.run_number }}
        run: node scripts/apply-release-manifest.mjs
      - name: Audit IWA distribution
        run: pnpm audit:iwa
        env:
          IWA_ALLOW_UPDATE_MANIFEST: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '1' || '' }}
      - name: Bundle IWA Web Bundle
        run: |
          if [ "$RELEASE_BUILD" = "true" ]; then
            pnpm bundle:iwa -- --out "release/lastro-v2-${GITHUB_SHA}.wbn"
          else
            pnpm bundle:iwa -- --out release/lastro-v2-ci.wbn
          fi
        env:
          IWA_ALLOW_UPDATE_MANIFEST: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '1' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: iwa-bundle
          path: |
            release/*.wbn
            release/audit-report.json
          if-no-files-found: error
          retention-days: 14

  release-iwa:
    name: Sign & publish IWA release
    needs: [lint, test, build-iwa]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: iwa-bundle
      - name: Prepare production signing key
        id: key
        env:
          IWA_SIGNING_KEY: ${{ secrets.IWA_SIGNING_KEY }}
        run: |
          key_path="${RUNNER_TEMP}/iwa-signing-key.pem"
          umask 077
          printf '%s' "$IWA_SIGNING_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"
      - name: Check production release configuration
        env:
          IWA_WEB_BUNDLE_ID: ${{ secrets.IWA_WEB_BUNDLE_ID || vars.IWA_WEB_BUNDLE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$IWA_WEB_BUNDLE_ID" || { echo "Missing IWA_WEB_BUNDLE_ID in the production Environment (secret or variable)." >&2; exit 1; }
          test -n "$R2_ACCOUNT_ID" || { echo "Missing R2_ACCOUNT_ID in the production Environment." >&2; exit 1; }
          test -n "$R2_BUCKET" || { echo "Missing R2_BUCKET in the production Environment." >&2; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "Missing R2_ENDPOINT in the production Environment." >&2; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "Missing R2_ACCESS_KEY_ID in the production Environment secrets." >&2; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "Missing R2_SECRET_ACCESS_KEY in the production Environment secrets." >&2; exit 1; }
          echo "Production release configuration is present."
      - name: Verify production release inputs
        env:
          IWA_WEB_BUNDLE_ID: ${{ vars.IWA_WEB_BUNDLE_ID || secrets.IWA_WEB_BUNDLE_ID }}
        run: node scripts/verify-release-inputs.mjs --key "${{ steps.key.outputs.path }}" --bundle-id "$IWA_WEB_BUNDLE_ID" --version "0.1.${{ github.run_number }}" --commit-sha "${{ github.sha }}"
      - name: Sign production bundle
        env:
          WEB_BUNDLE_SIGNING_PASSPHRASE: ${{ secrets.WEB_BUNDLE_SIGNING_PASSPHRASE }}
          IWA_WEB_BUNDLE_ID: ${{ vars.IWA_WEB_BUNDLE_ID || secrets.IWA_WEB_BUNDLE_ID }}
        run: node scripts/sign-production-iwa.mjs --input "release/lastro-v2-${{ github.sha }}.wbn" --key "${{ steps.key.outputs.path }}" --out "release/lastro-v2-${{ github.sha }}.swbn" --bundle-id "$IWA_WEB_BUNDLE_ID" --commit-sha "${{ github.sha }}"
      - name: Publish to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/publish-r2.mjs --release-dir release --bundle "lastro-v2-${{ github.sha }}.swbn"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "iwa-${{ github.run_number }}" \
            "release/lastro-v2-${{ github.sha }}.swbn" \
            "release/lastro-v2-${{ github.sha }}.swbn.sha256" \
            "release/release-manifest.json" \
            "release/audit-report.json" \
            --title "IWA ${{ github.run_number }}" \
            --generate-notes
      - name: Remove temporary signing material
        if: always()
        run: rm -f "${{ steps.key.outputs.path }}"

  build-web:
    name: Build web distribution
    needs: lint
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist-web/
          if-no-files-found: error
          retention-days: 14

  deploy-web:
    name: Deploy web to Surge
    needs: [lint, test, build-web]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    environment:
      name: production-web
      url: https://game.ltsd.ro
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        run: pnpm dlx surge@0.24.6 dist-web game.ltsd.ro
