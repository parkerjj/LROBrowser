name: IWA CI & Release

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') && !startsWith(github.ref, 'refs/tags/') }}

env:
  IWA_UPDATE_MANIFEST_URL: https://client.ltsd.ro/updates.json
  IWA_BUNDLE_BASE_URL: https://client.ltsd.ro/

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: TLS probe & streamlined test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Verify official HTTPS via real JavaScript TLS on Direct TCP/443
        env:
          LASTRO_TLS_LIVE: "1"
        run: pnpm exec vitest run test/direct-tls-live.test.ts --testTimeout 30000
      - run: pnpm prepare:runtime
      - name: Unit test suite (each file runs once)
        run: pnpm exec vitest run --exclude test/release-smoke.test.ts

  build-iwa:
    name: Build non-production IWA CI bundle
    needs: lint
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Audit IWA CI distribution
        run: pnpm audit:iwa
      - name: Bundle IWA CI Web Bundle
        run: pnpm bundle:iwa -- --out release/lastro-v2-ci.wbn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iwa-ci-bundle
          path: |
            release/*.wbn
            release/audit-report.json
          if-no-files-found: error
          retention-days: 14

  fetch-ke:
    name: Download & verify latest KoreEngine Release
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download and validate stable private KE Release
        env:
          KE_REPOSITORY_READ_TOKEN: ${{ secrets.KE_REPOSITORY_READ_TOKEN }}
        run: node scripts/kore-local.mjs --download-release --out "$RUNNER_TEMP/ke-release"
      - name: Record KE provenance
        run: cat "$RUNNER_TEMP/ke-release/release.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-ke-release
          path: ${{ runner.temp }}/ke-release/
          if-no-files-found: error
          retention-days: 3

  build-production-iwa:
    name: Build production IWA with verified KE
    needs: [lint, test, fetch-ke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      KE_REQUIRE_PACKAGE: '1'
      IWA_ALLOW_UPDATE_MANIFEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-ke-release
          path: ${{ runner.temp }}/ke-release
      - name: Import verified KE package
        run: node scripts/kore-local.mjs --import-package "$RUNNER_TEMP/ke-release/package" --release-metadata "$RUNNER_TEMP/ke-release/release.json"
      - run: pnpm build
      - run: pnpm minify:release
      - name: Compute IWA version (1.<commit count>.<commit date yyMMdd, Asia/Shanghai>)
        id: version
        run: echo "value=1.$(git rev-list --count "$GITHUB_SHA").$(TZ=Asia/Shanghai git show -s --format=%cd --date=format-local:%y%m%d "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Inject production manifest metadata
        env:
          IWA_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/apply-release-manifest.mjs
      - name: Require intact KE in final IWA distribution
        run: node scripts/kore-local.mjs --verify-dist dist --release-metadata "$RUNNER_TEMP/ke-release/release.json"
      - run: pnpm audit:iwa
      - name: Bundle production IWA
        run: pnpm bundle:iwa -- --out "release/lastro-v2-${GITHUB_SHA}.wbn"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iwa-production-bundle
          path: |
            release/*.wbn
            release/audit-report.json
          if-no-files-found: error
          retention-days: 14

  release-iwa:
    name: Sign & publish IWA release
    needs: [lint, test, build-production-iwa, build-web]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: iwa-production-bundle
          path: release
      - name: Check production release configuration
        env:
          IWA_WEB_BUNDLE_ID: ${{ secrets.IWA_WEB_BUNDLE_ID || vars.IWA_WEB_BUNDLE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$IWA_WEB_BUNDLE_ID" || { echo "Missing IWA_WEB_BUNDLE_ID in the production Environment (secret or variable)." >&2; exit 1; }
          test -n "$R2_ACCOUNT_ID" || { echo "Missing R2_ACCOUNT_ID in the production Environment." >&2; exit 1; }
          test -n "$R2_BUCKET" || { echo "Missing R2_BUCKET in the production Environment." >&2; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "Missing R2_ENDPOINT in the production Environment." >&2; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "Missing R2_ACCESS_KEY_ID in the production Environment secrets." >&2; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "Missing R2_SECRET_ACCESS_KEY in the production Environment secrets." >&2; exit 1; }
          echo "Production release configuration is present."
      - name: Prepare production signing key
        id: key
        env:
          IWA_SIGNING_KEY: ${{ secrets.IWA_SIGNING_KEY }}
        run: |
          key_path="${RUNNER_TEMP}/iwa-signing-key.pem"
          umask 077
          printf '%s' "$IWA_SIGNING_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"
      - name: Verify production release inputs
        env:
          IWA_WEB_BUNDLE_ID: ${{ vars.IWA_WEB_BUNDLE_ID || secrets.IWA_WEB_BUNDLE_ID }}
        run: node scripts/verify-release-inputs.mjs --key "${{ steps.key.outputs.path }}" --bundle-id "$IWA_WEB_BUNDLE_ID" --version "${{ needs.build-production-iwa.outputs.version }}" --commit-sha "${{ github.sha }}"
      - name: Sign production bundle
        env:
          WEB_BUNDLE_SIGNING_PASSPHRASE: ${{ secrets.WEB_BUNDLE_SIGNING_PASSPHRASE }}
          IWA_WEB_BUNDLE_ID: ${{ vars.IWA_WEB_BUNDLE_ID || secrets.IWA_WEB_BUNDLE_ID }}
        run: node scripts/sign-production-iwa.mjs --input "release/lastro-v2-${{ github.sha }}.wbn" --key "${{ steps.key.outputs.path }}" --out "release/lastro-v2-${{ github.sha }}.swbn" --bundle-id "$IWA_WEB_BUNDLE_ID" --commit-sha "${{ github.sha }}"
      - name: Refuse stale production source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current_main" = "$GITHUB_SHA" || { echo 'Refusing stale main production release.' >&2; exit 1; }
      - name: Publish to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          IWA_VERSION: ${{ needs.build-production-iwa.outputs.version }}
        run: node scripts/publish-r2.mjs --release-dir release --bundle "lastro-v2-${{ github.sha }}.swbn"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "iwa-${{ needs.build-production-iwa.outputs.version }}" \
            "release/lastro-v2-${{ github.sha }}.swbn" \
            "release/lastro-v2-${{ github.sha }}.swbn.sha256" \
            "release/release-manifest.json" \
            "release/audit-report.json" \
            --target "$GITHUB_SHA" \
            --title "IWA ${{ needs.build-production-iwa.outputs.version }}" \
            --generate-notes
      - name: Remove temporary signing material
        if: always()
        run: rm -f "${{ steps.key.outputs.path }}"

  build-web:
    name: Build web distribution
    needs: [lint, fetch-ke]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-ke-release
          path: ${{ runner.temp }}/ke-release
      - name: Import verified KE package
        run: node scripts/kore-local.mjs --import-package "$RUNNER_TEMP/ke-release/package" --release-metadata "$RUNNER_TEMP/ke-release/release.json"
      - run: pnpm build:web
        env:
          KE_REQUIRE_PACKAGE: '1'
      - name: Require intact KE in final Web distribution
        run: node scripts/kore-local.mjs --verify-dist dist-web --release-metadata "$RUNNER_TEMP/ke-release/release.json"
      - name: Verify Web hosting supports the KE shared-memory Worker
        run: node scripts/kore-local.mjs --verify-web-hosting
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: dist-web/
          if-no-files-found: error
          retention-days: 14

  deploy-web:
    name: Deploy web to Surge
    needs: [lint, test, build-web, build-production-iwa]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment:
      name: production-web
      url: https://game.ltsd.ro
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: dist-web
      - name: Refuse stale production source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current_main" = "$GITHUB_SHA" || { echo 'Refusing stale main web deployment.' >&2; exit 1; }
      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        run: pnpm dlx surge@0.24.6 dist-web game.ltsd.ro
