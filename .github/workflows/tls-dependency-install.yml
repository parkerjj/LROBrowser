name: Resolve TLS dependency lockfile

on:
  push:
    branches: [Development]
    paths: [.github/workflows/tls-dependency-install.yml]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Development
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned browser TLS dependency and refresh frozen lockfile
        run: pnpm add --save-exact --ignore-scripts @reclaimprotocol/tls@0.1.4
      - name: Commit dependency and lockfile to Development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "build(iwa): pin @reclaimprotocol/tls v0.1.4 and update pnpm lockfile"
          git push origin HEAD:Development
