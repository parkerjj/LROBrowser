[package]
name = "native-probe"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"

[lib]
name = "native_probe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
