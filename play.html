<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15231d" />
    <link rel="manifest" href="/.well-known/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-64.png" type="image/png" sizes="64x64" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>LRO进阶客户端(Powered by LTSD.Ro)</title>
    <style>
      #lastro-startup-screen { position: fixed; inset: 16px 0 auto; z-index: 2147483647;
        width: min(560px, calc(100% - 32px)); margin-inline: auto; padding: 20px;
        box-sizing: border-box; max-height: calc(100dvh - 32px); overflow: auto;
        background: #fff; color: #1f2933; border: 1px solid #cbd2d9; border-radius: 8px;
        font: 15px/1.6 Arial, "Microsoft YaHei", sans-serif; }
      #lastro-startup-heading { font-size: 22px; margin: 0 0 16px; }
      #lastro-startup-phase { font-weight: 600; margin: 0 0 8px; }
      #lastro-startup-message { margin: 0 0 12px; }
      #lastro-startup-help { white-space: pre-line; margin: 12px 0; }
      #lastro-startup-detail { overflow-wrap: anywhere; white-space: pre-wrap; max-height: 32vh;
        overflow: auto; padding: 12px; border-radius: 6px; background: #f1f3f5;
        font: 12px/1.5 Consolas, monospace; }
      #lastro-startup-copy { margin-top: 8px; }
      #lastro-startup-screen[data-state="error"] #lastro-startup-heading { color: #9b1c1c; }
    </style>
    <script src="/startup-diagnostics.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <section id="lastro-startup-screen" role="status" hidden>
      <h1 id="lastro-startup-heading"></h1>
      <p id="lastro-startup-phase"></p>
      <p id="lastro-startup-message"></p>
      <p id="lastro-startup-help"></p>
      <pre id="lastro-startup-detail" hidden></pre>
      <button id="lastro-startup-copy" type="button">复制诊断信息</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
